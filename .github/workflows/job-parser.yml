name: Job Parser - Automated Checks

on:
  schedule:
    # Запускаємо о 6:00 UTC та 18:00 UTC (8:00 та 20:00 за часовим поясом Oslo)
    - cron: '0 6,18 * * *'
  
# Дозволяємо запускати вручну з GitHub UI
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
      
      - name: Run job parser
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
      
      - name: Commit updated state.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Repository status before commit:"
          git status --short
          echo "Diff of state.json (if any):"
          git --no-pager diff -- data/state.json || true
          if ! git diff --quiet -- data/state.json; then
            git add data/state.json
            git commit -m "Update state.json from GitHub Actions"
            git push origin HEAD:main
          else
            echo "No state changes to commit."
          fi
        shell: bash
